<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PKIG — Konsola Zarządzania</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#0f0f0f;--ink2:#2a2a2a;--ink3:#666;--ink4:#aaa;--ink5:#e0e0e0;
  --bg:#f4f2ed;--sf:#fff;--bd:#e5e2da;--bd2:#ccc9c0;
  --ac:#c97c09;--alt:#fff7e6;--alt2:#fcefd5;
  --go:#0e6e3d;--go-bg:#e5f5ec;--go-lt:#b8e6cc;
  --bl:#1a4fa0;--bl-bg:#e8eef8;--bl-lt:#b8cef0;
  --pu:#5a2080;--pu-bg:#f0e8f8;--pu-lt:#c8a8e8;
  --rd:#b02020;--rd-bg:#fbe8e8;--rd-lt:#f0b8b8;
  --or:#c96020;--or-bg:#fdf0e8;--or-lt:#e8c090;
  --r:10px;--rl:16px;
  --sh:0 1px 3px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --sh-lg:0 4px 20px rgba(0,0,0,.1),0 1px 6px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5;display:flex;flex-direction:column}
/* TOPBAR */
.topbar{background:var(--ink);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0}
.tb-logo{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:#fff;letter-spacing:-.01em}
.tb-logo span{color:var(--ac)}
.role-sw{display:flex;gap:3px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:3px}
.rs-btn{padding:4px 10px;border-radius:6px;border:none;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;color:rgba(255,255,255,.45);background:transparent;white-space:nowrap}
.rs-btn.on{background:var(--ac);color:#fff}
.tb-user{display:flex;align-items:center;gap:8px}
.tb-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.tb-uname{font-size:12px;color:rgba(255,255,255,.6);font-weight:500}
/* SHELL */
.shell{display:flex;flex:1;overflow:hidden}
/* SIDEBAR */
.sidebar{width:210px;background:#1a1a1a;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}
.sb-sec{font-size:9px;font-weight:700;color:rgba(255,255,255,.22);text-transform:uppercase;letter-spacing:.12em;padding:14px 12px 4px}
.sb-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:7px;cursor:pointer;transition:all .15s;margin:1px 5px;user-select:none}
.sb-item:hover{background:rgba(255,255,255,.06)}
.sb-item.on{background:rgba(201,124,9,.2);border:1px solid rgba(201,124,9,.28)}
.sb-icon{font-size:15px;opacity:.6;flex-shrink:0}
.sb-item.on .sb-icon,.sb-item:hover .sb-icon{opacity:1}
.sb-lbl{font-size:11px;font-weight:500;color:rgba(255,255,255,.45)}
.sb-item.on .sb-lbl{color:#fff;font-weight:600}
.sb-item:hover .sb-lbl{color:rgba(255,255,255,.75)}
.sb-badge{margin-left:auto;background:#ff5c5c;color:#fff;font-size:8px;font-weight:700;padding:1px 6px;border-radius:100px}
.sb-badge.am{background:var(--ac)}
.sb-div{height:1px;background:rgba(255,255,255,.07);margin:5px 10px}
/* MAIN */
.main{flex:1;overflow-y:auto;background:var(--bg);display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:6px}.main::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.ph{background:rgba(244,242,237,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50;flex-shrink:0}
.ph-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.ph-sub{font-size:11px;color:var(--ink3);margin-top:1px}
.ph-bc{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);margin-bottom:3px}
.ph-bc span{cursor:pointer;color:var(--ac)}.ph-bc span:hover{text-decoration:underline}
.ph-bc .sep{color:var(--ink4);cursor:default}
.ph-r{display:flex;gap:7px;align-items:center;flex-shrink:0}
.content{padding:20px 22px;flex:1}
/* BUTTONS */
.btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--bd);background:var(--sf);font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:#a86408}
.btn.go{background:var(--go);border-color:var(--go);color:#fff}.btn.go:hover{background:#0a5530}
.btn.pu{background:var(--pu);border-color:var(--pu);color:#fff}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.xs{padding:3px 8px;font-size:10px}
.btn-rej{padding:5px 12px;border:1.5px solid var(--rd-lt);border-radius:7px;background:var(--rd-bg);color:var(--rd);font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-app{padding:5px 12px;border:none;border-radius:7px;background:var(--go);color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:16px}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:12px 14px;box-shadow:var(--sh)}
.sc-lbl{font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.sc-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--ink);line-height:1;margin-bottom:2px}
.sc-val.ac{color:var(--ac)}.sc-val.go{color:var(--go)}.sc-val.bl{color:var(--bl)}.sc-val.rd{color:var(--rd)}.sc-val.pu{color:var(--pu)}
.sc-sub{font-size:10px;color:var(--ink3)}
/* CARD */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--sh);margin-bottom:13px;overflow:hidden}
.ch{padding:11px 16px 9px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ch-l{display:flex;align-items:center;gap:8px}
.ch-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ch-t{font-size:12px;font-weight:700;color:var(--ink)}
.ch-s{font-size:10px;color:var(--ink3);margin-top:1px}
.ch-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cb{padding:13px 16px}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;padding:5px 10px 8px;border-bottom:1.5px solid var(--bd);white-space:nowrap}
.tbl th.tr{text-align:right}.tbl th.tc{text-align:center}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl td.tr{text-align:right}.tbl td.tc{text-align:center}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#faf9f5}
.tbl tfoot td{font-weight:700;background:var(--bg);border-top:2px solid var(--bd)!important;border-bottom:none!important}
.mn{font-family:'DM Mono',monospace}
/* BADGE */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:100px;font-size:10px;font-weight:600;white-space:nowrap}
.bg-go{background:var(--go-bg);color:var(--go);border:1px solid var(--go-lt)}
.bg-am{background:var(--alt);color:var(--ac);border:1px solid var(--alt2)}
.bg-bl{background:var(--bl-bg);color:var(--bl);border:1px solid var(--bl-lt)}
.bg-pu{background:var(--pu-bg);color:var(--pu);border:1px solid var(--pu-lt)}
.bg-rd{background:var(--rd-bg);color:var(--rd);border:1px solid var(--rd-lt)}
.bg-gr{background:var(--bg);color:var(--ink3);border:1px solid var(--bd)}
.bg-or{background:var(--or-bg);color:var(--or);border:1px solid var(--or-lt)}
/* PROGRESS */
.prog{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--bd)}
.prog-fill{height:100%;border-radius:4px;transition:width .4s}
.pf-go{background:var(--go)}.pf-am{background:var(--ac)}.pf-rd{background:var(--rd)}
/* ALERT */
.alert{padding:9px 12px;border-radius:9px;font-size:11px;font-weight:500;line-height:1.5;display:flex;align-items:flex-start;gap:7px;margin-bottom:12px}
.a-warn{background:#fff8ec;border:1px solid #f5d48a;color:#7a4a00}
.a-info{background:var(--bl-bg);border:1px solid var(--bl-lt);color:#1a3f7a}
.a-ok{background:var(--go-bg);border:1px solid var(--go-lt);color:var(--go)}
.a-rd{background:var(--rd-bg);border:1px solid var(--rd-lt);color:var(--rd)}
.a-pu{background:var(--pu-bg);border:1px solid var(--pu-lt);color:var(--pu)}
/* EMPLOYEE ROW (list) */
.emp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer;transition:all .15s}
.emp-row:last-child{border-bottom:none}
.emp-row:hover{background:var(--bg);margin:0 -16px;padding:10px 16px}
.er-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.er-name{font-size:13px;font-weight:700;color:var(--ink);flex:1}
.er-meta{font-size:11px;color:var(--ink3);margin-top:1px}
/* APPROVAL ITEM */
.ai{border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;background:var(--sf);overflow:hidden}
.ai-top{display:flex;align-items:flex-start;justify-content:space-between;padding:11px 13px 7px;gap:8px}
.ai-person{display:flex;align-items:center;gap:7px}
.ai-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.ai-name{font-size:12px;font-weight:700}
.ai-meta{font-size:10px;color:var(--ink3)}
.ai-hrs{font-family:'DM Mono',monospace;font-size:17px;font-weight:500;color:var(--ac);text-align:right}
.ai-prz{font-size:10px;color:var(--go);text-align:right;margin-top:1px}
.ai-detail{font-size:11px;color:var(--ink2);padding:0 13px 6px}
.ai-tags{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:0 13px 6px}
.ai-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3)}
/* EXPANDED approval edit panel */
.ai-edit{background:var(--bg);border-top:1px solid var(--bd);padding:10px 13px;display:none}
.ai-edit.open{display:block}
.aie-title{font-size:10px;font-weight:700;color:var(--pu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.aie-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.aie-col{display:flex;flex-direction:column;gap:4px}
.aie-lbl{font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.aie-inp{padding:6px 9px;border:1.5px solid var(--bd2);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink);background:var(--sf);width:100%}
.aie-inp:focus{outline:none;border-color:var(--ac)}
.aie-inp.mn{font-family:'DM Mono',monospace}
.aie-chk-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.aie-chk-row label{display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;padding:5px 10px;border:1.5px solid var(--bd);border-radius:7px;background:var(--sf);transition:all .12s}
.aie-chk-row label.checked{background:var(--alt);border-color:var(--ac);font-weight:600}
/* BONUS INLINE */
.bonus-inline{background:var(--pu-bg);border:1px solid var(--pu-lt);border-radius:8px;padding:9px 12px;margin-top:6px}
.bi-title{font-size:10px;font-weight:700;color:var(--pu);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.bi-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
/* LP TABLE */
.lp-wrap{overflow-x:auto}
.lp-tbl{border-collapse:collapse;font-size:11px;width:max-content;min-width:100%}
.lp-tbl th{background:var(--ink);color:#fff;padding:7px 9px;text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;position:sticky;top:0}
.lp-tbl th.ec{text-align:left;position:sticky;left:0;z-index:2;background:var(--ink);min-width:160px}
.lp-tbl td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
.lp-tbl td.ec{text-align:left;position:sticky;left:0;background:var(--sf);font-weight:600;z-index:1;border-right:1px solid var(--bd)}
.lp-tbl tr:hover td{background:#faf9f5}
.lp-tbl tr:hover td.ec{background:#faf9f5}
.lp-pct{font-family:'DM Mono',monospace;font-size:11px;font-weight:500}
.lp-tbl tfoot td{background:var(--bg);font-weight:700;border-top:2px solid var(--bd2);border-bottom:none;font-family:'DM Mono',monospace}
.lp-sum{background:var(--ink)!important;color:#fff!important;font-weight:700!important}
/* PROJ CARD */
.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:14px}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:13px;box-shadow:var(--sh);cursor:pointer;transition:all .2s}
.pc:hover{box-shadow:var(--sh-lg);border-color:var(--ac);transform:translateY(-1px)}
.pc.over{border-left:3px solid var(--rd)}
/* ENTRY ROW in emp detail */
.entry-row{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:7px;overflow:hidden}
.er2-top{display:flex;align-items:flex-start;padding:10px 13px 7px;gap:8px;cursor:pointer}
.er2-top:hover{background:#faf9f5}
.er2-main{flex:1;min-width:0}
.er2-proj{font-size:12px;font-weight:700;color:var(--ink)}
.er2-sub{font-size:10px;color:var(--ink3);margin-top:1px}
.er2-hrs{text-align:right;flex-shrink:0}
.er2-h{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:var(--ac)}
.er2-prz{font-family:'DM Mono',monospace;font-size:11px;color:var(--go);margin-top:1px}
.er2-tags{display:flex;gap:3px;flex-wrap:wrap;padding:0 13px 8px}
.er2-edit{background:var(--bg);border-top:1px solid var(--bd);padding:10px 13px;display:none}
.er2-edit.open{display:block}
.er2-changed{background:var(--or-bg);border-top:1px solid var(--or-lt);padding:7px 13px;font-size:11px;color:var(--or);font-weight:500}
/* MODAL */
.modal-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--sf);border-radius:18px;padding:22px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg)}
.modal::-webkit-scrollbar{display:none}
.modal-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:3px}
.modal-sub{font-size:11px;color:var(--ink3);margin-bottom:14px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fg label{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select,.fg textarea{padding:8px 10px;border:1.5px solid var(--bd2);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink);background:var(--bg);width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--ac)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.modal-acts{display:flex;gap:7px;margin-top:12px}
/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:10px 18px;border-radius:100px;opacity:0;transition:opacity .25s;z-index:400;white-space:nowrap;box-shadow:var(--sh-lg);pointer-events:none}
.toast.show{opacity:1}
.fade-in{animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sal-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.sal-row:last-child{border-bottom:none}
.sal-lbl{font-size:11px;color:var(--ink2);flex:1}
.sal-sub{font-size:9px;color:var(--ink3);margin-top:1px}
.sal-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;text-align:right;white-space:nowrap}
.sal-val.pos{color:var(--go)}.sal-val.muted{color:var(--ink3)}
.sal-inp{width:90px;padding:4px 8px;border:1.5px solid var(--bd2);border-radius:6px;font-family:'DM Mono',monospace;font-size:12px;text-align:right;color:var(--ink);background:var(--bg)}
.bonus-item{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;margin-bottom:7px;position:relative}
.bonus-item.kierownik{border-left:3px solid var(--bl)}
.bonus-item.hr{border-left:3px solid var(--ac)}
.bonus-item.zatw{border-left:3px solid var(--go)}
.bonus-who{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:2px}
.bonus-kwt{font-family:'DM Mono',monospace;font-size:14px;font-weight:600;color:var(--go)}
.bonus-note{font-size:11px;color:var(--ink2);font-style:italic;margin-top:2px;line-height:1.4}
.bonus-del{position:absolute;top:8px;right:9px;font-size:12px;cursor:pointer;color:var(--ink4)}
.bonus-del:hover{color:var(--rd)}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-logo">PK<span>IG</span> · Konsola</div>
  <div class="role-sw" style="overflow-x:auto;max-width:600px">
    <div id="role-sw-inner" style="display:flex;gap:2px;flex-wrap:nowrap;min-width:max-content"></div>
  </div>
  <div class="tb-user">
    <div class="tb-av" id="tb-av" style="background:var(--pu)">ŁK</div>
    <div class="tb-uname" id="tb-uname">Ada Borkowski-T65 · Zarząd</div>
  </div>
</div>
<div class="shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="ph" id="ph">
      <div>
        <div class="ph-bc" id="ph-bc"></div>
        <div class="ph-title" id="ph-title">Dashboard</div>
        <div class="ph-sub" id="ph-sub">Kwiecień 2026 · stan na dziś 22.04</div>
      </div>
      <div class="ph-r" id="ph-r"></div>
    </div>
    <div class="content"><div id="vc" class="fade-in"></div></div>
  </div>
</div>
<div id="mc"></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════
   API — połączenie z Google Apps Script
══════════════════════════════════════ */
const API_URL   = 'https://script.google.com/macros/s/AKfycbxFxhe1wMSlbRRW4lOtlk29EZ74EQ24gOMVd8wF5cF4Q6HVtkyX8TvNK7pX3e-ZByKKpQ/exec';
const API_TOKEN = 'pkig2026secret';
const USE_API   = true; // false = tryb demo (dane w pamięci)

async function apiGet(action, params={}){
  if(!USE_API) return null;
  try{
    const qs = new URLSearchParams({action, token:API_TOKEN, ...params}).toString();
    const res = await fetch(API_URL + '?' + qs);
    return await res.json();
  }catch(e){ console.error('API GET error:', e); return null; }
}

async function apiPost(action, data){
  if(!USE_API) return null;
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, token:API_TOKEN, data})
    });

/* Ładowanie wszystkich danych z serwera przy starcie konsoli */
async function loadAllFromServer(){
  if(!USE_API) return;
  try{
    const [prac, wpisy, proj, url, prem, arch] = await Promise.all([
      apiGet('getPracownicy'),
      apiGet('getWpisy'),
      apiGet('getProjekty'),
      apiGet('getUrlopy'),
      apiGet('getPremie'),
      apiGet('getArchiwum'),
    ]);
    if(prac && Array.isArray(prac) && prac.length){
      EMPLOYEES.length = 0;
      prac.forEach(p=>EMPLOYEES.push(p));
    }
    if(wpisy && Array.isArray(wpisy)){
      ENTRIES.length = 0;
      wpisy.forEach(w=>ENTRIES.push(w));
    }
    if(url && Array.isArray(url)){
      LEAVES.length = 0;
      url.forEach(l=>LEAVES.push(l));
    }
    if(prem && Array.isArray(prem)){
      BONUSES.length = 0;
      prem.forEach(b=>BONUSES.push(b));
    }
    if(arch && typeof arch === 'object'){
      Object.assign(PAYROLL_ARCHIVE, arch);
    }
    buildRoleSwitcher();
    renderAll();
  }catch(e){ console.error('Load error:', e); }
}

   urlop_dni, l4_dni, obecnosc_pct, narastajaco

const PAYROLL_ARCHIVE = {};

function archivePayrollMonth(month){
  const snapshot = {
    month,
    approved: true,
    approvedBy: SEBASTIAN.name,
    approvedAt: new Date().toLocaleString('pl-PL'),
    employees: EMPLOYEES.map(e=>{
      const h = PROJECTS.reduce((s,p)=>s+p.hoursLog.filter(l=>l.empId===e.id&&l.month===month).reduce((ss,l)=>ss+l.hrs,0),0);
      const rabh = e.typ==='etat'?(e.customRbh||e.netto/168):0;
      const prop = e.typ==='etat'?Math.round(e.netto*(h/168)*100)/100:0;
      const nad_h = Math.max(0,h-168);
      const nad_pln = e.typ==='etat'?Math.round(nad_h*rabh*100)/100:0;
      const zlec = e.typ==='zlecenie'?Math.round(h*e.rate*100)/100:0;
      const wyjazdEntries = ENTRIES.filter(en=>en.empId===e.id&&en.wyjazd&&en.status==='approved');
      const wyjazd_dni = wyjazdEntries.length;
      const dieta = wyjazd_dni * DIETA;
      const zdalna_dni = ENTRIES.filter(en=>en.empId===e.id&&en.zdalna&&en.status==='approved').length;
      const premia = BONUSES.filter(b=>b.empId===e.id&&b.month===month).reduce((s,b)=>s+b.kwt,0);
      const urlop_dni = LEAVES.filter(l=>l.empId===e.id&&l.type==='urlop').reduce((s,l)=>s+(l.dni||0),0);
      const l4_dni = LEAVES.filter(l=>l.empId===e.id&&l.type==='l4').reduce((s,l)=>s+(l.dni||0),0);
      const lacznie = Math.round((prop+nad_pln+dieta+premia+zlec)*100)/100;
      const robocze = 22; // plan dni roboczych w miesiącu
      const przeprac = h>0?Math.round(h/8):0;
      const obecnosc = Math.round((przeprac/(robocze-urlop_dni-l4_dni||1))*100);
      return {
        nazwisko:e.last, imie:e.first, kod:e.kod,
        dzial:e.deptName, typ:e.typ,
        netto:e.netto, rbh:rabh,
        godz_plan:168, godz_pracy:h,
        nadgodz_h:nad_h, nadgodz_pln:nad_pln,
        wyjazd_dni, dieta, zdalna_dni,
        premia, lacznie,
        urlop_dni, l4_dni, obecnosc_pct:obecnosc,
        wypłata_podstawa: prop||zlec,
      };
    })
  };
  PAYROLL_ARCHIVE[month] = snapshot;

  // Update narastajaco (YTD cumulative)
  EMPLOYEES.forEach(e=>{
    const archMonths = Object.keys(PAYROLL_ARCHIVE).sort();
    e.narastajaco = archMonths.reduce((s,m)=>{
      const ae = PAYROLL_ARCHIVE[m]?.employees?.find(x=>x.kod===e.kod);
      return s + (ae?.lacznie||0);
    },0);
  });
}

function calcEntry(e){
  const h=e.hrs;
  const wm=e.weekendMult!=null?e.weekendMult:1.5;
  const isWknd=()=>{const d=new Date(e.date);return d.getDay()===0||d.getDay()===6;};
  const wknd=isWknd();
  let prz=0,bd=[];
  if(wknd){prz=h*wm;bd.push({lbl:`Weekend ×${wm}`,h,v:prz});}
  else if(e.wyjazd){
    const n=Math.min(h,8),ov=Math.max(h-8,0);
    const v1=n*1.3;prz+=v1;bd.push({lbl:'Wyjazd ≤8h ×1.3',h:n,v:v1});
    if(ov>0){const v2=ov*1.5;prz+=v2;bd.push({lbl:'Wyjazd nadgodz. ×1.5',h:ov,v:v2});}
  }else{
    const n=Math.min(h,8),ov=Math.max(h-8,0);
    prz+=n;bd.push({lbl:'Dzienne ×1.0',h:n,v:n});
    if(ov>0){const v=ov*1.5;prz+=v;bd.push({lbl:'Nadgodziny ×1.5',h:ov,v:v});}
  }
  const dieta=e.wyjazd?(e.dietaOv!=null?e.dietaOv:DIETA):0;
  return{przeprac:h,przelicz:Math.round(prz*100)/100,dieta,bd,wknd};
}
function calcLP(empId,month){
  const res={};SL.forEach(s=>res[s.id]=0);let totH=0;
  PROJECTS.forEach(p=>{

    const h=log.reduce((s,l)=>s+l.hrs,0);totH+=h;
    if(h>0)p.sl.forEach(s=>{res[s.id]=(res[s.id]||0)+h*(s.pct/100);});

}

/* Returns the EMPLOYEES record for the currently logged-in user */
function getLoggedInUser(){
  const r=ROLES[ROLE];if(!r)return null;
  return EMPLOYEES.find(u=>u.last===r.last)||null;
}

/* Returns dept IDs managed by the current user ([] for non-managers) */
function getManagedDepts(){
  if(ROLE==='zarzad'||ROLE==='zarzad_cfo'||ROLE==='hr')return null; // null = all
  const u=getLoggedInUser();
  return u&&u.managedDepts&&u.managedDepts.length>0?u.managedDepts:[];
}

/* Returns filtered EMPLOYEES visible to current role */
function getVisibleEmployees(){
  const depts=getManagedDepts();
  if(depts===null)return EMPLOYEES; // zarząd/HR sees all
  // kierownik sees own dept employees (excluding other managers' private data)
  return EMPLOYEES.filter(e=>depts.includes(e.dept));
}

/* Can current role approve hours for this employee? */
function canApprove(empId){
  if(ROLE==='zarzad'||ROLE==='zarzad_cfo')return true;
  if(ROLE==='hr')return false;
  const e=emp(empId);if(!e)return false;
  // Primary check: is current user assigned as manager or deputy for this employee?
  const currentUser=getLoggedInUser();
  if(currentUser){
    if(e.managerId===currentUser.id)return true;
    if(e.deputyId===currentUser.id)return true;
  }
  // Fallback: dept-based check
  const depts=getManagedDepts();
  return depts&&depts.includes(e.dept);
}

  else if(VIEW==='hr-lp'||VIEW==='z-lp')vc.innerHTML=vHRLP();

function vEmpDetail(empId){

  const h04=PROJECTS.reduce((s,p)=>s+p.hoursLog.filter(l=>l.empId===empId&&l.month==='04/2026').reduce((ss,l)=>ss+l.hrs,0),0);
  const myBonuses=BONUSES.filter(b=>b.empId===empId&&b.month==='04/2026');

    const plan=168,rabh=e.netto/plan;

    return{prop,nad,dietSum,rabh,plan};

          ${e.netto>0?`<span style="font-size:10px;color:rgba(255,255,255,.38)">netto bazowe: ${e.netto.toLocaleString('pl-PL')} zł/m-c</span>`:''}

      <div class="aie-col"><div class="aie-lbl">Dieta dzienna (zł)</div><input type="number" class="aie-inp" value="${en.dietaOv!=null?en.dietaOv:(en.wyjazd?DIETA:0)}" min="0" step="5" onchange="updateEntryField(${en.id},'dietaOv',+this.value)"/></div>

    </div>

        <div class="aie-col" style="flex:2"><div class="aie-lbl">Uzasadnienie</div><input type="text" class="aie-inp" id="bi-note-${en.id}" placeholder="Za co premia..."/></div>
        <div style="align-self:flex-end"><button class="btn xs pu" onclick="addBonusFromEntry(${en.id},${en.empId})">Dodaj</button></div>
      </div>
    </div>
    <div style="display:flex;gap:6px;margin-top:10px">
      <button class="btn xs btn-rej" onclick="rejectEntry(${en.id})">Odrzuć wpis</button>
      <button class="btn xs go" onclick="approveEntry(${en.id})">Zatwierdź ✓</button>
      <button class="btn xs pri" onclick="saveEntryChanges(${en.id})">💾 Zapisz zmiany</button>
    </div>
  </div>`;
}

/* ══════════════════════════════
   APPROVALS VIEW
══════════════════════════════ */
function vZatwierdz(){
  const pending=ENTRIES.filter(e=>e.status==='pending'&&canApprove(e.empId)).sort((a,b)=>b.date.localeCompare(a.date));
  const weeks={};
  pending.forEach(en=>{
    const d=new Date(en.date);const dayN=d.getDate();
    const w=dayN>=21?'22–28 kwietnia':dayN>=15?'15–21 kwietnia':'8–14 kwietnia';
    if(!weeks[w])weeks[w]=[];weeks[w].push(en);
  });
  return`<div>
    ${ROLE==='kierownik'?`<div class="alert a-info"><span>👷</span><span>Widzisz tylko wpisy pracowników przypisanych do Ciebie. Zarząd może zatwierdzać godziny wszystkim pracownikom.</span></div>`:''}
    <div class="alert a-pu"><span>🔑</span><span>Rozwiń wpis aby edytować godziny, flagi (wyjazd, auto, zdalna), stawkę weekendową, dietę i dodać premię specjalną. Każda zmiana zostanie odnotowana pracownikowi.</span></div>
    ${pending.length===0?'<div class="alert a-ok"><span>✅</span><span>Wszystkie wpisy zatwierdzone!</span></div>':''}
    ${Object.entries(weeks).map(([week,items])=>{
      const totH=items.reduce((s,en)=>s+en.hrs,0);
      return`<div style="margin-bottom:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:7px;border-bottom:2px solid var(--ac)">
          <div style="font-family:'Fraunces',serif;font-size:15px;font-weight:600">Tydzień ${week}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:11px;color:var(--ink3)">${items.length} wpisów · ${hstr(totH)}</span>
            <button class="btn go sm" onclick="approveWeek('${week}')">Zatwierdź tydzień ✓</button>
          </div>
        </div>
        ${items.map(en=>{
          const e=emp(en.empId);const p=proj(en.proj);if(!e||!p)return'';
          const calc=calcEntry(en);
          const isExp=expandedApprovals.has(en.id);
          const isWknd=(()=>{const d=new Date(en.date);return d.getDay()===0||d.getDay()===6;})();
          return`<div class="ai">
            <div class="ai-top" onclick="toggleApproval(${en.id})">
              <div class="ai-person">
                <div class="ai-av" style="background:${eColor(e.id)}">${initials(e)}</div>
                <div><div class="ai-name">${fullName(e)} <span style="font-family:'DM Mono',monospace;font-size:9px;color:var(--ink3)">${e.kod}</span></div>
                <div class="ai-meta">${en.date} · ${p.name}</div></div>
              </div>
              <div>
                <div class="ai-hrs">${en.hrs}h</div>
                <div class="ai-prz">→ ${hstr(calc.przelicz)} prz.</div>
                ${calc.dieta>0?`<div style="font-size:10px;color:var(--bl);text-align:right">${calc.dieta} zł</div>`:''}
              </div>
            </div>
            <div class="ai-detail">${en.note||'—'} · ${en.etap==='teren'?'🏗️':'💻'} ${en.start}–${en.end}</div>
            <div class="ai-tags">
              <span class="ai-time">${en.start}–${en.end}</span>
              ${en.wyjazd?'<span class="badge bg-bl">🧳 wyjazd</span>':''}
              ${en.auto?'<span class="badge bg-am">🚗 auto</span>':''}
              ${en.zdalna?'<span class="badge bg-go">🏠 zdalna</span>':''}
              ${isWknd?`<span class="badge bg-pu">📅 weekend ${en.weekendMult!=null?'×'+en.weekendMult:'×1.5'}</span>`:''}
              ${en.ustalenia?`<span class="badge bg-or">📌 ustalenia</span>`:''}
              <span style="margin-left:auto;font-size:11px;color:var(--ink3)">koszt pracy: <strong style="font-family:'DM Mono',monospace">${fmtPln(en.hrs*e.rate)}</strong></span>
              <div style="color:var(--ink4);font-size:13px;transition:transform .2s;${isExp?'transform:rotate(90deg)':''}">›</div>
            </div>
            ${en.ustalenia?`<div style="background:var(--or-bg);border-top:1px solid var(--or-lt);padding:6px 13px;font-size:11px;color:var(--or)">📌 ${en.ustalenia}</div>`:''}
            <div class="ai-edit ${isExp?'open':''}">
              ${isExp?renderEntryEditPanel(en):''}
            </div>
            <div style="display:flex;gap:6px;padding:7px 13px;background:var(--bg);border-top:1px solid var(--bd)">
              <button class="btn-rej" onclick="rejectEntry(${en.id})">Odrzuć</button>
              <button class="btn-app" onclick="approveEntry(${en.id})">Zatwierdź ✓</button>
              <button class="btn xs pu" style="background:var(--pu-bg);border:1px solid var(--pu-lt);color:var(--pu)" onclick="toggleApproval(${en.id})">🔑 ${isExp?'Zwiń':'Edytuj i zatwierdź'}</button>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

/* ══ REST OF VIEWS (abbreviated but functional) ══ */
function vProjekty(){
  if(PROJ_DETAIL) return vProjDetail(PROJ_DETAIL);

  const myDepts=getManagedDepts();
  const canEdit=ROLE==='zarzad'||ROLE==='zarzad_cfo'||ROLE.startsWith('k_')||ROLE==='kierownik';

  /* Filter projects the current user can see */
  function canSeeProject(p){
    if(myDepts===null) return true; // zarząd/HR sees all
    return p.sl.some(ps=>{
      const s=slById(ps.id);
      return s&&myDepts.includes(s.deptId);
    });
  }
  const visProj=PROJECTS.filter(canSeeProject);

  /* Group SLs visible to user */
  const visSlIds=myDepts===null
    ? SL.map(s=>s.id)
    : SL.filter(s=>myDepts.includes(s.deptId)).map(s=>s.id);

  /* Which SLs actually have projects? */
  const activeSls=SL.filter(s=>
    visSlIds.includes(s.id) &&
    visProj.some(p=>p.sl.some(ps=>ps.id===s.id))
  );

  /* Also projects with no matching SL (unassigned) */
  const unassigned=visProj.filter(p=>
    !p.sl.some(ps=>visSlIds.includes(ps.id))
  );

  const totalH=visProj.reduce((s,p)=>s+projH(p),0);
  const over=visProj.filter(p=>projSt(p)==='over').length;

  return`<div>
    <!-- TOP BAR -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <div style="display:flex;gap:7px;flex-wrap:wrap;flex:1">
        ${KANBAN_COLS.map(c=>{const n=visProj.filter(p=>p.status===c.id).length;return`
        <div style="background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:7px 12px;display:flex;align-items:center;gap:7px;box-shadow:var(--sh)">
          <div style="width:8px;height:8px;border-radius:50%;background:${c.color}"></div>
          <div style="font-size:11px;font-weight:600;color:${c.color}">${c.label}</div>
          <div style="font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:${c.color}">${n}</div>
        </div>`;}).join('')}
        ${over>0?`<div style="background:var(--rd-bg);border:1px solid var(--rd-lt);border-radius:var(--r);padding:7px 12px;font-size:11px;font-weight:600;color:var(--rd)">⚠️ ${over} przekroczył budżet</div>`:''}
        <div style="background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:7px 12px;font-size:11px;color:var(--ink3)">
          Łącznie: <strong>${hstr(totalH)}</strong> · <strong>${fmtPln(visProj.reduce((s,p)=>s+projCost(p),0))}</strong>
        </div>
      </div>
      ${canEdit?`<button class="btn pri" onclick="openAddProject()">+ Nowy projekt</button>`:''}
    </div>

    <!-- GROUPED BY SERVICE LINE -->
    ${activeSls.map(sl=>{
      const slProjs=visProj.filter(p=>p.sl.some(ps=>ps.id===sl.id));
      const cols=KANBAN_COLS.map(c=>({...c,items:slProjs.filter(p=>p.status===c.id)}));
      const slH=slProjs.reduce((s,p)=>s+projH(p),0);
      const slCost=slProjs.reduce((s,p)=>s+projCost(p),0);
      return`<div style="margin-bottom:24px">
        <!-- LS Header -->
        <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:${sl.color}12;border:1px solid ${sl.color}30;border-radius:var(--r);margin-bottom:10px">
          <div style="width:12px;height:12px;border-radius:50%;background:${sl.color};flex-shrink:0"></div>
          <div style="font-size:13px;font-weight:700;color:${sl.color}">${sl.name}</div>
          <div style="font-size:10px;color:var(--ink3);background:var(--sf);padding:2px 8px;border-radius:100px;border:1px solid var(--bd)">${sl.short} · LP</div>
          <div style="font-size:11px;color:var(--ink3);margin-left:4px">${slProjs.length} projektów · ${hstr(slH)}</div>
          <div style="margin-left:auto;font-family:'DM Mono',monospace;font-size:11px;font-weight:600;color:var(--go)">${fmtPln(slCost)}</div>
        </div>
        <!-- Kanban columns for this SL -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          ${cols.map(col=>`
          <div id="col-${sl.id}-${col.id}"
            style="background:${col.bg};border:2px solid transparent;border-radius:var(--r);padding:8px;min-height:80px;transition:border-color .2s"
            ondragover="event.preventDefault();document.getElementById('col-${sl.id}-${col.id}').style.borderColor='${col.color}'"
            ondragleave="document.getElementById('col-${sl.id}-${col.id}').style.borderColor='transparent'"
            ondrop="dropProject(event,'${col.id}')">
            <div style="font-size:10px;font-weight:700;color:${col.color};margin-bottom:7px;display:flex;align-items:center;gap:5px">
              <div style="width:7px;height:7px;border-radius:50%;background:${col.color}"></div>
              ${col.label}
              <span style="background:${col.color};color:#fff;font-size:9px;padding:0px 5px;border-radius:100px;margin-left:2px">${col.items.length}</span>
            </div>
            ${col.items.length===0?`<div style="text-align:center;padding:16px 6px;font-size:10px;color:var(--ink4);font-style:italic">—</div>`:''}
            ${col.items.map(p=>{
              const h=projH(p),pct=p.budgetH>0?h/p.budgetH:0,st=projSt(p);
              const barCol=st==='over'?'var(--rd)':pct>0.85?'var(--ac)':'var(--go)';
              const commN=p.comments?p.comments.length:0;
              return`<div draggable="true"
                ondragstart="DRAG_ID='${p.id}';event.currentTarget.style.opacity='.5'"
                ondragend="event.currentTarget.style.opacity='1'"
                style="background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:9px 10px;margin-bottom:7px;cursor:pointer;box-shadow:var(--sh);transition:box-shadow .15s"
                onmouseenter="this.style.boxShadow='var(--sh-lg)'"
                onmouseleave="this.style.boxShadow='var(--sh)'">
                <div onclick="PROJ_DETAIL='${p.id}';renderAll()">
                  <div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">
                    <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--ink4);background:var(--bg);padding:1px 5px;border-radius:3px;border:1px solid var(--bd)">${p.id}</div>
                    ${commN>0?`<div style="font-size:9px;color:var(--bl)">💬${commN}</div>`:''}
                    ${st==='over'?'<div style="font-size:9px;color:var(--rd)">⚠️</div>':''}
                  </div>
                  <div style="font-size:11px;font-weight:700;color:var(--ink);margin-bottom:2px;line-height:1.4">${p.name}</div>
                  <div style="font-size:10px;color:var(--ink3);margin-bottom:6px">${p.client}</div>
                  <div style="height:4px;background:var(--bg);border-radius:2px;overflow:hidden;border:1px solid var(--bd);margin-bottom:5px">
                    <div style="height:100%;width:${Math.min(pct,1)*100}%;background:${barCol};border-radius:2px"></div>
                  </div>
                  <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--ink3)">
                    <span>${h}h/${p.budgetH}h</span>
                    <span>📅 ${(p.deadline||'').slice(5)||'—'}</span>
                  </div>
                </div>
                ${canEdit?`<div style="display:flex;gap:4px;margin-top:7px;padding-top:6px;border-top:1px solid var(--bd)">
                  <select style="flex:1;padding:2px 5px;border:1px solid var(--bd);border-radius:5px;font-size:9px;background:var(--bg);cursor:pointer"
                    onclick="event.stopPropagation()"
                    onchange="event.stopPropagation();moveProject('${p.id}',this.value)">
                    ${KANBAN_COLS.map(c=>`<option value="${c.id}" ${p.status===c.id?'selected':''}>${c.label}</option>`).join('')}
                  </select>
                  <button onclick="event.stopPropagation();PROJ_DETAIL='${p.id}';renderAll()" style="padding:2px 7px;border:1px solid var(--bl-lt);border-radius:5px;background:var(--bl-bg);color:var(--bl);font-size:9px;cursor:pointer">✎</button>
                  <button onclick="event.stopPropagation();deleteProject('${p.id}')" style="padding:2px 6px;border:1px solid var(--rd-lt);border-radius:5px;background:var(--rd-bg);color:var(--rd);font-size:9px;cursor:pointer">🗑</button>
                </div>`:''}</div>`;
            }).join('')}
          </div>`).join('')}
        </div>
      </div>`;
    }).join('')}

    ${unassigned.length>0?`<div style="margin-top:10px">
      <div style="font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:8px">Bez przypisanej linii serwisowej</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${unassigned.map(p=>`<div style="background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:9px 12px;cursor:pointer;box-shadow:var(--sh)" onclick="PROJ_DETAIL='${p.id}';renderAll()">
          <div style="font-size:11px;font-weight:700">${p.id} · ${p.name}</div>
          <div style="font-size:10px;color:var(--ink3)">${p.client}</div>
        </div>`).join('')}
      </div>
    </div>`:''}
  </div>`;
}


/* ── PROJECT DETAIL ── */

  const barCol=st==='over'?'var(--rd)':pct>0.85?'var(--ac)':'var(--go)';
  const canEdit=ROLE==='zarzad'||ROLE==='zarzad_cfo'||ROLE==='hr'||ROLE.startsWith('k_')||ROLE==='kierownik';
  const col=KANBAN_COLS.find(c=>c.id===p.status)||KANBAN_COLS[0];
  const myUser=getLoggedInUser();

  return`<div>
    <!-- BACK -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">

      <div style="font-size:15px;font-weight:700;color:var(--ink)">${p.name}</div>
      <div style="margin-left:auto;display:flex;gap:7px;align-items:center">
        ${canEdit?`

      </div>
      <div class="cb">

        </div>

    </div>

    <!-- KOMENTARZE -->

/* ── PAYROLL DETAIL (single employee) ── */

  const prop=e.typ==='etat'?e.netto*(h/168):0;

  const diet=ENTRIES.filter(en=>en.empId===empId&&en.wyjazd&&en.status==='approved').length*DIETA;
  const bonusTotal=BONUSES.filter(b=>b.empId===empId&&b.month===month).reduce((s,b)=>s+b.kwt,0);
  const zlec=e.typ==='zlecenie'?h*e.rate:0;
  const total=prop+nad+diet+bonusTotal+zlec;
  const{pcts}=calcLP(empId,month);
  const myEntries=ENTRIES.filter(en=>en.empId===empId&&en.status==='approved').sort((a,b)=>b.date.localeCompare(a.date));

          onchange="PLACA_STATUS[${empId}]=this.value;renderContent()">

        <div style="font-size:16px;font-weight:700;color:#fff">${fullName(e)}</div>

function vRaporty(){
  const month='04/2026';

  // ── Godziny ogólne firmy ──
  const allApproved=ENTRIES.filter(e=>e.status==='approved');
  const totalH=allApproved.reduce((s,e)=>s+e.hrs,0);
  const totalPrz=allApproved.reduce((s,e)=>s+calcEntry(e).przelicz,0);
  const totalWyjazd=allApproved.filter(e=>e.wyjazd).length;

  // ── Godziny wg działów ──
  const deptMap={};
  allApproved.forEach(e=>{
    const emp_=emp(e.empId);if(!emp_)return;
    const d=emp_.deptName||'Inne';
    if(!deptMap[d])deptMap[d]={h:0,prz:0,nad:0,emps:new Set()};
    deptMap[d].h+=e.hrs;
    deptMap[d].prz+=calcEntry(e).przelicz;
    if(e.hrs>8)deptMap[d].nad+=(e.hrs-8);
    deptMap[d].emps.add(e.empId);
  });
  const deptRows=Object.entries(deptMap).sort((a,b)=>b[1].h-a[1].h);

  // ── Top 10 nadgodziny ──
  const empH={};
  allApproved.forEach(e=>{
    if(!empH[e.empId])empH[e.empId]={h:0,prz:0,nad:0};
    empH[e.empId].h+=e.hrs;
    empH[e.empId].prz+=calcEntry(e).przelicz;
    empH[e.empId].nad+=Math.max(0,e.hrs-8);

  const topNad=Object.entries(empH)
    .map(([id,v])=>({emp_:emp(+id),...v}))
    .filter(x=>x.emp_&&x.nad>0)
    .sort((a,b)=>b.nad-a.nad)

  // ── Top 10 wyjazdy ──

    .map(([id,dni])=>({emp_:emp(+id),dni}))

    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">

    <!-- GODZINY WG DZIAŁÓW -->
    <div class="card">
      <div class="ch"><div class="ch-icon" style="background:#fff8ec">🏢</div>
        <div><div class="ch-t">Roboczogodziny wg działów</div><div class="ch-s">kwiecień 2026 · zatwierdzone</div></div>

function exportRaportyXLSX(){
  const wb=XLSX.utils.book_new();
  const allApproved=ENTRIES.filter(e=>e.status==='approved');

  // Sheet 1: Godziny wg działów
  const dMap={};
  allApproved.forEach(e=>{
    const emp_=emp(e.empId);if(!emp_)return;
    const d=emp_.deptName||'Inne';
    if(!dMap[d])dMap[d]={h:0,prz:0,nad:0,emps:new Set()};
    dMap[d].h+=e.hrs;dMap[d].prz+=calcEntry(e).przelicz;
    if(e.hrs>8)dMap[d].nad+=(e.hrs-8);dMap[d].emps.add(e.empId);
  });
  const rows1=[['Dział','Roboczogodziny','Przeliczeniowe','Nadgodziny','Liczba pracowników']];
  Object.entries(dMap).sort((a,b)=>b[1].h-a[1].h).forEach(([d,v])=>{
    rows1.push([d,Math.round(v.h*10)/10,Math.round(v.prz*10)/10,Math.round(v.nad*10)/10,v.emps.size]);
  });
  rows1.push(['RAZEM',
    Math.round(Object.values(dMap).reduce((s,v)=>s+v.h,0)*10)/10,
    Math.round(Object.values(dMap).reduce((s,v)=>s+v.prz,0)*10)/10,
    Math.round(Object.values(dMap).reduce((s,v)=>s+v.nad,0)*10)/10,
    new Set(allApproved.map(e=>e.empId)).size
  ]);
  const ws1=XLSX.utils.aoa_to_sheet(rows1);
  ws1['!cols']=[{wch:26},{wch:16},{wch:16},{wch:14},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws1,'Godziny wg działów');

  // Sheet 2: Top nadgodziny
  const eH={};
  allApproved.forEach(e=>{
    if(!eH[e.empId])eH[e.empId]={h:0,nad:0};
    eH[e.empId].h+=e.hrs;eH[e.empId].nad+=Math.max(0,e.hrs-8);
  });
  const rows2=[['Lp.','Nazwisko','Imię','Dział','Typ','Godz. łącznie','Nadgodziny h']];
  Object.entries(eH).filter(([,v])=>v.nad>0).sort((a,b)=>b[1].nad-a[1].nad).forEach(([id,v],i)=>{
    const e=emp(+id);if(!e)return;
    rows2.push([i+1,e.last,e.first,e.deptName,e.typ,Math.round(v.h*10)/10,Math.round(v.nad*10)/10]);
  });
  const ws2=XLSX.utils.aoa_to_sheet(rows2);
  ws2['!cols']=[{wch:4},{wch:16},{wch:12},{wch:22},{wch:10},{wch:14},{wch:14}];

  // Sheet 3: Szczegółowe wszystkie wpisy
  const rows3=[['Data','Pracownik','Dział','Projekt','Etap','Godz.','Przelicz.','Wyjazd','Zdalna','Nadgodz.']];
  allApproved.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const emp_=emp(e.empId);const calc=calcEntry(e);
    rows3.push([e.date,emp_?emp_.last+' '+emp_.first:'?',emp_?.deptName||'',
      e.proj,e.etap==='teren'?'Teren':'Biuro',e.hrs,calc.przelicz,
      e.wyjazd?'TAK':'',e.zdalna?'TAK':'',Math.max(0,e.hrs-8)||'']);
  });
  const ws3=XLSX.utils.aoa_to_sheet(rows3);
  ws3['!cols']=[{wch:12},{wch:22},{wch:22},{wch:10},{wch:8},{wch:8},{wch:10},{wch:8},{wch:8},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws3,'Wszystkie wpisy');

  XLSX.writeFile(wb,'PKIG_raport_kwiecien_2026.xlsx');
}

function updateNEKier(){

  const mgrs=EMPLOYEES.filter(u=>u.role==='kierownik'&&(u.managedDepts||[]).includes(deptId));
  sel.innerHTML=mgrs.length
    ?mgrs.map(m=>`<option value="${m.id}">${m.first} ${m.last}</option>`).join('')
    :'<option value="">Brak kierownika dla tego działu</option>';

function saveNewEmployee(){
  const first=document.getElementById('ne-first')?.value.trim();
  const last=document.getElementById('ne-last')?.value.trim();
  const typ=document.getElementById('ne-typ')?.value||'etat';
  const netto=parseFloat(document.getElementById('ne-netto')?.value)||0;
  const dept=document.getElementById('ne-dept')?.value||'';
  const mgrId=parseInt(document.getElementById('ne-mgr')?.value)||0;
  const role=document.getElementById('ne-role')?.value||'pracownik';
  const email=document.getElementById('ne-email')?.value.trim()||'';
  const dob=document.getElementById('ne-dob')?.value||'';
  const hire=document.getElementById('ne-hire')?.value||'';
  if(!first||!last){showToast('Podaj imię i nazwisko');return;}
  if(!dept){showToast('Wybierz dział');return;}
  const deptNames={dept_pom:'Pomiary powierzchni',dept_foto:'Fotogrametria',dept_geo:'Geodezja miejska',
    dept_gprawna:'Geodezja prawna',dept_lk85:'LK85',dept_szkolenia:'Szkolenia',dept_adm:'Administracja'};
  const newId=Math.max(...EMPLOYEES.map(e=>e.id))+1;
  const deptColors={dept_pom:'#c97c09',dept_foto:'#187945',dept_geo:'#0e7a7a',
    dept_gprawna:'#8a5a2d',dept_lk85:'#2d5a8a',dept_adm:'#c96020'};
  EMPLOYEES.push({
    id:newId,
    kod:'#'+( 1000+newId),
    first,last,
    dept,deptName:deptNames[dept]||dept,
    typ,netto,rate:netto>0&&typ!=='zlecenie'?Math.round(netto/168*100)/100:0,
    ppk:false,u26:false,
    role,managedDepts:[],
    av:(first[0]+last[0]).toUpperCase(),
    color:deptColors[dept]||'#666',
    email,dob,hire,
    managerId:mgrId||null,
  });
  if(USE_API){
    apiPost('savePracownik', {kod:'#'+(1000+newId), last, first, dept, deptName:deptNames[dept]||dept,
      typ, netto, rate:netto>0&&typ!=='zlecenie'?Math.round(netto/168*100)/100:0,
      role, av:(first[0]+last[0]).toUpperCase(), color:deptColors[dept]||'#666',
      email, dob, hire, managerId:mgrId||null});
  }
  closeModal();
  buildRoleSwitcher();
  renderAll();
  showToast('✅ '+first+' '+last+' dodany/a do systemu · '+email);
}

/* ── Eksport roczny — wszystkie miesiące w jednym pliku ── */
function exportRocznyXLSX(){
  const months=Object.keys(PAYROLL_ARCHIVE).sort();
  if(!months.length){showToast('Brak danych do eksportu');return;}
  const wb=XLSX.utils.book_new();

  /* SHEET: Podsumowanie roczne */
  const headerRow=['Lp.','Nazwisko','Imię','Kod','Dział','Typ'];
  months.forEach(m=>headerRow.push(...[m+' Podstawa',m+' Nadgodz.',m+' Diety',m+' Premie',m+' Łącznie']));
  headerRow.push('YTD Łącznie');
  const summaryRows=[headerRow];

  EMPLOYEES.forEach((e,i)=>{
    const row=[i+1,e.last,e.first,e.kod,e.deptName,e.typ];
    let ytd=0;
    months.forEach(m=>{
      const ae=PAYROLL_ARCHIVE[m]?.employees?.find(x=>x.kod===e.kod);
      row.push(ae?.wypłata_podstawa||0,ae?.nadgodz_pln||0,ae?.dieta||0,ae?.premia||0,ae?.lacznie||0);
      ytd+=(ae?.lacznie||0);
    });
    row.push(Math.round(ytd*100)/100);
    summaryRows.push(row);
  });

  /* Suma row */
  const sumaRow=['','','SUMA','','',''];
  months.forEach(m=>{
    const ma=PAYROLL_ARCHIVE[m];
    if(ma){
      sumaRow.push(
        Math.round(ma.employees.reduce((s,e)=>s+e.wypłata_podstawa,0)*100)/100,
        Math.round(ma.employees.reduce((s,e)=>s+e.nadgodz_pln,0)*100)/100,
        Math.round(ma.employees.reduce((s,e)=>s+e.dieta,0)*100)/100,
        Math.round(ma.employees.reduce((s,e)=>s+e.premia,0)*100)/100,
        Math.round(ma.employees.reduce((s,e)=>s+e.lacznie,0)*100)/100
      );
    }else sumaRow.push(0,0,0,0,0);
  });
  sumaRow.push(Math.round(EMPLOYEES.reduce((s,e)=>s+(e.narastajaco||0),0)*100)/100);
  summaryRows.push(sumaRow);

  const ws=XLSX.utils.aoa_to_sheet(summaryRows);
  XLSX.utils.book_append_sheet(wb,ws,'Zestawienie roczne');

  /* Osobny sheet per miesiąc */
  months.forEach(m=>{
    const a=PAYROLL_ARCHIVE[m];
    const rows=[['Nazwisko','Imię','Kod','Typ','Godz.','Podstawa','Nadgodz.h','Nadgodz.PLN','Wyjazd dni','Diety','Zdalna dni','Premie','Łącznie','Urlop','L4','Obecność%']];
    a.employees.forEach(e=>rows.push([e.nazwisko,e.imie,e.kod,e.typ,e.godz_pracy,e.wypłata_podstawa,e.nadgodz_h,e.nadgodz_pln,e.wyjazd_dni,e.dieta,e.zdalna_dni,e.premia,e.lacznie,e.urlop_dni,e.l4_dni,e.obecnosc_pct]));
    const wsm=XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb,wsm,m.replace('/','_'));
  });

  XLSX.writeFile(wb,'PKIG_zestawienie_roczne_2026.xlsx');
}

/* Can current role see this employee's financial/HR data? */
function canSeeFin(targetEmpId){
  if(ROLE==='zarzad'||ROLE==='zarzad_cfo'||ROLE==='hr') return true;
  const target=emp(targetEmpId);
  if(!target) return false;
  // Kierownicy nie widzą nawzajem swoich kart HR
  if(['kierownik','z_kierownik','zarzad'].includes(target.role)) return false;
  // Kierownik widzi swoich pracowników
  const depts=getManagedDepts();
  return depts&&depts.includes(target.dept);
}

/* helper: format PLN for cell */
function plnVal(v){ return Math.round(v*100)/100; }

/* ── 1. Arkusz płacowy — lista zbiorcza ── */
function exportPlacaXLSX(){
  const month='04/2026';
  const wb=XLSX.utils.book_new();

  /* SHEET 1: Lista zbiorcza */
  const rows=[
    ['Arkusz płacowy PKIG — '+month],
    [],
    ['Lp.','Kod','Nazwisko','Imię','Dział','Typ umowy',
     'Godz. przeprac.','Wynagrodzenie','Nadgodziny','Diety (zł)',
     'Premie (zł)','Łącznie do wypłaty (zł)','Status HR'],
  ];

  EMPLOYEES.forEach((e,i)=>{
    const h=PROJECTS.reduce((s,p)=>s+p.hoursLog.filter(l=>l.empId===e.id&&l.month===month).reduce((ss,l)=>ss+l.hrs,0),0);
    const rabh=e.typ==='etat'&&e.netto>0?e.netto/168:0;
    const prop=e.typ==='etat'?plnVal(e.netto*(h/168)):0;
    const nad=e.typ==='etat'?plnVal(Math.max(0,h-168)*(e.customRbh||rabh)):0;
    const diet=ENTRIES.filter(en=>en.empId===e.id&&en.wyjazd&&en.status==='approved').length*DIETA;
    const bonus=BONUSES.filter(b=>b.empId===e.id&&b.month===month).reduce((s,b)=>s+b.kwt,0);
    const zlec=e.typ==='zlecenie'?plnVal(h*e.rate):0;
    const total=plnVal(prop+nad+diet+bonus+zlec);
    const st={'todo':'Do zrobienia','checking':'Do sprawdzenia','done':'Zakończone'}[PLACA_STATUS[e.id]||'todo'];
    rows.push([
      i+1, e.kod, e.last, e.first, e.deptName, e.typ,
      h, prop||zlec, nad, diet, bonus, total, st
    ]);
  });

  // Totals row
  const totalSum=plnVal(EMPLOYEES.reduce((s,e)=>{
    const h=PROJECTS.reduce((ss,p)=>ss+p.hoursLog.filter(l=>l.empId===e.id&&l.month===month).reduce((sss,l)=>sss+l.hrs,0),0);
    const rabh=e.typ==='etat'&&e.netto>0?e.netto/168:0;
    const prop=e.typ==='etat'?e.netto*(h/168):0;
    const nad=e.typ==='etat'?Math.max(0,h-168)*rabh:0;
    const diet=ENTRIES.filter(en=>en.empId===e.id&&en.wyjazd&&en.status==='approved').length*DIETA;
    const bonus=BONUSES.filter(b=>b.empId===e.id&&b.month===month).reduce((ss,b)=>ss+b.kwt,0);
    const zlec=e.typ==='zlecenie'?h*e.rate:0;
    return s+prop+nad+diet+bonus+zlec;
  },0));
  rows.push([]);
  rows.push(['','','','','','SUMA',
    EMPLOYEES.reduce((s,e)=>s+PROJECTS.reduce((ss,p)=>ss+p.hoursLog.filter(l=>l.empId===e.id&&l.month===month).reduce((sss,l)=>sss+l.hrs,0),0),0),
    '','','','',totalSum,'']);

  const ws1=XLSX.utils.aoa_to_sheet(rows);

  /* column widths */
  ws1['!cols']=[{wch:4},{wch:8},{wch:18},{wch:14},{wch:22},{wch:10},
    {wch:10},{wch:16},{wch:12},{wch:10},{wch:10},{wch:20},{wch:16}];

  XLSX.utils.book_append_sheet(wb,ws1,'Lista zbiorcza');

  /* SHEET 2: Wg działów */
  const deptRows=[['Dział','Liczba os.','Suma godz.','Łącznie do wypłaty (zł)']];
  const depts={};
  EMPLOYEES.forEach(e=>{
    const dn=e.deptName||'Inny';
    if(!depts[dn])depts[dn]={count:0,hrs:0,total:0};
    depts[dn].count++;
    const h=PROJECTS.reduce((s,p)=>s+p.hoursLog.filter(l=>l.empId===e.id&&l.month===month).reduce((ss,l)=>ss+l.hrs,0),0);
    const rabh=e.typ==='etat'&&e.netto>0?e.netto/168:0;
    const prop=e.typ==='etat'?e.netto*(h/168):0;
    const nad=e.typ==='etat'?Math.max(0,h-168)*rabh:0;
    const diet=ENTRIES.filter(en=>en.empId===e.id&&en.wyjazd&&en.status==='approved').length*DIETA;
    const bonus=BONUSES.filter(b=>b.empId===e.id&&b.month===month).reduce((s,b)=>s+b.kwt,0);
    const zlec=e.typ==='zlecenie'?h*e.rate:0;
    depts[dn].hrs+=h;
    depts[dn].total+=prop+nad+diet+bonus+zlec;
  });
  Object.entries(depts).forEach(([dn,d])=>{
    deptRows.push([dn,d.count,d.hrs,plnVal(d.total)]);
  });
  const ws2=XLSX.utils.aoa_to_sheet(deptRows);
  ws2['!cols']=[{wch:28},{wch:10},{wch:12},{wch:22}];
  XLSX.utils.book_append_sheet(wb,ws2,'Wg działów');

  /* SHEET 3: Premie */
  const bonusRows=[['Pracownik','Kod','Kwota netto','Kto przyznał','Uzasadnienie','Data','Projekt']];
  BONUSES.filter(b=>b.month===month).forEach(b=>{
    const e=emp(b.empId);
    bonusRows.push([e?e.last+' '+e.first:'?',e?e.kod:'',b.kwt,b.whonm,b.note,b.date,b.proj||'']);
  });
  const ws3=XLSX.utils.aoa_to_sheet(bonusRows);
  ws3['!cols']=[{wch:20},{wch:8},{wch:12},{wch:20},{wch:40},{wch:12},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws3,'Premie specjalne');

  saveXLSX(wb,'PKIG_arkusz_placowy_'+month.replace('/','_')+'.xlsx');
}

function moveProject(id, newStatus){
  const p=PROJECTS.find(x=>x.id===id);
  if(!p)return;
  p.status=newStatus;
  const col=KANBAN_COLS.find(c=>c.id===newStatus);
  showToast('Projekt przeniesiony → '+col?.label);
  renderContent();
}

function dropProject(event, newStatus){
  event.preventDefault();
  document.querySelectorAll('[id^="col-"]').forEach(el=>el.style.borderColor='transparent');
  if(DRAG_ID){
    moveProject(DRAG_ID, newStatus);
    DRAG_ID=null;
  }
}

function addComment(projId){
  const p=PROJECTS.find(x=>x.id===projId);
  if(!p)return;
  const el=document.getElementById('new-comment-'+projId);
  const text=el?el.value.trim():'';
  if(!text){showToast('Wpisz treść komentarza');return;}
  const u=getLoggedInUser();
  if(!p.comments)p.comments=[];
  p.comments.push({
    id: Date.now(),
    author: u?u.first+' '+u.last:(ROLES[ROLE]?.last||ROLE),
    av: u?u.av:'?',
    color: u?u.color:'var(--ac)',
    text,
    date: new Date().toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}),
  });
  if(el)el.value='';
  renderContent();
  showToast('Komentarz dodany');
}

function deleteProject(id){
  const p=PROJECTS.find(x=>x.id===id);

  if(ROLE!=='zarzad'&&ROLE!=='zarzad_cfo'){

/* Helper: pick dept in modal — rerenders SL buttons */
function pickDept(deptId){
  document.getElementById('np-dept').value=deptId;
  // Update dept buttons style
  document.querySelectorAll('.dept-pick-btn').forEach(b=>{
    const active=b.dataset.deptid===deptId;
    b.style.borderColor=active?'var(--ac)':'var(--bd)';
    b.style.background=active?'var(--alt)':'var(--sf)';
    b.style.color=active?'var(--ac)':'var(--ink3)';
    b.style.fontWeight=active?'700':'500';
  });
  // Rerender SL buttons for selected dept
  const sls=SL.filter(s=>s.deptId===deptId);
  const slWrap=document.getElementById('np-sl-btns');
  if(slWrap){
    slWrap.innerHTML=sls.map((s,i)=>`<button type="button" class="sl-pick-btn" data-slid="${s.id}"
      onclick="pickSL('${s.id}')"
      style="padding:4px 10px;border-radius:100px;border:1.5px solid ${i===0?s.color:'var(--bd)'};
        background:${i===0?s.color+'18':'var(--sf)'};color:${i===0?s.color:'var(--ink3)'};
        font-size:10px;font-weight:600;cursor:pointer">${s.name}</button>`).join('')
      ||(sls.length===0?'<span style="font-size:11px;color:var(--ink4)">Brak linii serwisowych</span>':'');
    document.getElementById('np-sl').value=sls[0]?.id||'';
  }
}

function pickSL(slId){
  document.getElementById('np-sl').value=slId;
  document.querySelectorAll('.sl-pick-btn').forEach(b=>{
    const s=SL.find(x=>x.id===b.dataset.slid);
    const active=b.dataset.slid===slId;
    b.style.borderColor=active?s?.color:'var(--bd)';
    b.style.background=active?s?.color+'18':'var(--sf)';
    b.style.color=active?s?.color:'var(--ink3)';
  });
}

        <label>Status</label>
        <select id="ep-status">
          ${KANBAN_COLS.map(c=>`<option value="${c.id}" ${p.status===c.id?'selected':''}>${c.label}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>Opis (opcjonalnie)</label>
        <textarea id="ep-desc" rows="3">${p.description||''}</textarea>
      </div>
      <div class="modal-acts">
        <button class="btn" onclick="closeModal()">Anuluj</button>
        <button class="btn go" onclick="saveEditProject('${pid}')">Zapisz ✓</button>
      </div>
    </div>
  </div>`;
}

function ePickDept(deptId){
  document.getElementById('ep-dept').value=deptId;
  document.querySelectorAll('.edept-btn').forEach(b=>{
    const a=b.dataset.deptid===deptId;
    b.style.borderColor=a?'var(--ac)':'var(--bd)';b.style.background=a?'var(--alt)':'var(--sf)';
    b.style.color=a?'var(--ac)':'var(--ink3)';b.style.fontWeight=a?'700':'500';
  });
  const sls=SL.filter(s=>s.deptId===deptId);
  const wrap=document.getElementById('ep-sl-btns');
  if(wrap){
    wrap.innerHTML=sls.map((s,i)=>`<button type="button" class="esl-btn" data-slid="${s.id}" onclick="ePickSL('${s.id}')"
      style="padding:4px 10px;border-radius:100px;border:1.5px solid ${i===0?s.color:'var(--bd)'};
      background:${i===0?s.color+'18':'var(--sf)'};color:${i===0?s.color:'var(--ink3)'};font-size:10px;font-weight:600;cursor:pointer">${s.name}</button>`).join('');
    document.getElementById('ep-sl').value=sls[0]?.id||'';
  }
}
function ePickSL(slId){
  document.getElementById('ep-sl').value=slId;
  document.querySelectorAll('.esl-btn').forEach(b=>{
    const s=SL.find(x=>x.id===b.dataset.slid);const a=b.dataset.slid===slId;
    b.style.borderColor=a?s?.color:'var(--bd)';b.style.background=a?s?.color+'18':'var(--sf)';b.style.color=a?s?.color:'var(--ink3)';
  });
}


function saveEditProject(pid){
  const p=PROJECTS.find(x=>x.id===pid);if(!p)return;
  p.name=document.getElementById('ep-name')?.value.trim()||p.name;
  p.client=document.getElementById('ep-client')?.value.trim()||p.client;
  p.budgetH=parseFloat(document.getElementById('ep-budget')?.value)||p.budgetH;
  p.deadline=document.getElementById('ep-deadline')?.value||p.deadline;
  p.status=document.getElementById('ep-status')?.value||p.status;
  const newSl=document.getElementById('ep-sl')?.value;
  if(newSl)p.sl=[{id:newSl,pct:100}];
  p.description=document.getElementById('ep-desc')?.value||'';
  closeModal();
  renderContent();
  showToast('Projekt zaktualizowany');
}

function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('mc').innerHTML='';}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

// Boot - build dynamic role switcher
function buildRoleSwitcher(){
  const c=document.getElementById('role-sw-inner');if(!c)return;
  c.innerHTML=''; // wyczyść przed każdym przebudowaniem
  // Zarząd
  [{role:'zarzad',label:'🏛 Kacprzak CEO'},{role:'zarzad_cfo',label:'💼 Przybyła CFO'}].forEach(({role,label})=>{
    const b=document.createElement('button');
    b.className='rs-btn'+(ROLE===role?' on':'');
    b.textContent=label;b.onclick=()=>setRole(role,b);c.appendChild(b);
  });
  // HR
  const hrEmp=EMPLOYEES.find(u=>u.role==='hr');
  if(hrEmp){
    const b=document.createElement('button');
    b.className='rs-btn'+(ROLE==='hr'?' on':'');
    b.textContent='📋 '+hrEmp.last;
    b.onclick=()=>setRole('hr',b);c.appendChild(b);
  }
  // Zastępcy kierownika
  EMPLOYEES.filter(u=>u.role==='z_kierownik').forEach(zk=>{
    const role='zk_'+zk.id;
    ROLES[role]={last:zk.last,title:'Zastępca kier. · '+zk.deptName,av:zk.av,color:zk.color,deptId:zk.dept};
    NAV[role]=NAV.z_kierownik;
    const b=document.createElement('button');
    b.className='rs-btn'+(ROLE===role?' on':'');
    b.textContent='🔸 '+zk.last;
    b.title=zk.first+' '+zk.last+' · Zastępca · '+zk.deptName;
    b.onclick=()=>setRole(role,b);c.appendChild(b);
  });
  // Kierownicy — jeden per unikalny dział żeby nie dublować
  const seenDepts=new Set();
  EMPLOYEES.filter(u=>u.role==='kierownik').forEach(mgr=>{
    const role='k_'+mgr.id;
    ROLES[role]={last:mgr.last,title:'Kierownik · '+mgr.deptName,av:mgr.av,color:mgr.color};
    NAV[role]=NAV.kierownik;
    const b=document.createElement('button');
    b.className='rs-btn'+(ROLE===role?' on':'');
    // Skróć etykietę: tylko nazwisko
    b.textContent='👷 '+mgr.last;
    b.title=mgr.first+' '+mgr.last+' · '+mgr.deptName; // tooltip z pełną nazwą
    b.onclick=()=>setRole(role,b);c.appendChild(b);
  });
}

// Override setRole to rebuild switcher and update managedDepts for dynamic manager roles
// setRole is defined below - this override handles dynamic manager roles

// Update canApprove + getManagedDepts for dynamic manager roles
const _origGetMD=getManagedDepts;
function getManagedDepts(){
  if(ROLE==='zarzad'||ROLE==='zarzad_cfo'||ROLE==='hr')return null;
  if(ROLE.startsWith('k_')){
    const mgrId=parseInt(ROLE.split('_')[1]);
    const mgr=EMPLOYEES.find(u=>u.id===mgrId);
    return mgr&&mgr.managedDepts&&mgr.managedDepts.length>0?mgr.managedDepts:[];
  }
  if(ROLE.startsWith('zk_')){
    const zkId=parseInt(ROLE.split('_')[1]);
    const zk=EMPLOYEES.find(u=>u.id===zkId);
    return zk?[zk.dept]:[];
  }
  const u=getLoggedInUser();
  return u&&u.managedDepts&&u.managedDepts.length>0?u.managedDepts:[];
}

buildRoleSwitcher();
setRole('zarzad',null);
if(typeof USE_API!=='undefined' && USE_API) loadAllFromServer();
</script>
